#cloud-config
# MarineEdge · one-paste server setup for Ubuntu 24.04. Paste it where the provider takes cloud-init:
#   AWS EC2 › Advanced details › User data · Google Compute Engine › Metadata › key "user-data" ·
#   Hetzner / DigitalOcean / Vultr › Cloud config / User data · Oracle › Initialization script.
# Edit the values under "content:" first.
#
#   ADMIN_TOKEN   the server admin password (long, no spaces): it creates the first account, which becomes the
#                 owner; keep it in a password manager. Leave empty to get a random one written to
#                 /opt/marineedge/.env and /var/log/marineedge-install.log on the server.
#   DOMAIN        tracker.yourcompany.com (A record → the server's IP), or leave empty to get
#                 https://<ip>.sslip.io with a real certificate and no domain purchase.
#   AUTO_UPDATE   1 = pull every new commit from GitHub within 10 minutes, test it on the server, deploy if green
#   GITHUB_TOKEN  ONLY if the GitHub repository is private: a fine-grained personal access token for this one
#                 repository with "Contents: Read-only" (github.com › Settings › Developer settings › Fine-grained
#                 tokens). Leave empty when the repository is public.
#
# Five minutes after the server boots, open https://<DOMAIN> on the phone › Get started › Create account, with
# the ADMIN_TOKEN as the server admin password. Then paste the free aisstream.io key on the map screen
# (Datalastic and the rest: Profile › Data sources). Everyone else joins by invite from Profile › Team.
write_files:
  - path: /opt/marineedge-setup.env
    permissions: "0600"
    content: |
      ADMIN_TOKEN=
      DOMAIN=
      AUTO_UPDATE=1
      GITHUB_TOKEN=
      PROVIDER=aisstream
      DATALASTIC_API_KEY=
  - path: /opt/marineedge-bootstrap.sh
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      # fetches deploy/install.sh from GitHub (with the token when the repository is private) and runs it
      set -euo pipefail
      set -a; . /opt/marineedge-setup.env; set +a
      URL=https://raw.githubusercontent.com/0xdeni/MarineEdge-/main/deploy/install.sh
      if [ -n "${GITHUB_TOKEN:-}" ]; then
        curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" "$URL" | bash
      else
        curl -fsSL "$URL" | bash || echo "== install did not finish: see /var/log/marineedge-install.log (a private repository needs GITHUB_TOKEN)" | tee -a /var/log/marineedge-install.log
      fi
package_update: true
packages: [curl, git]
runcmd:
  - [bash, /opt/marineedge-bootstrap.sh]
