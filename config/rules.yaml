# Every threshold the rule engine uses. Edit, restart the API (or POST /api/rules/reload), re-run.
# Units: hours (h), nautical miles (nm), knots (kn), metres (m).

port_call:
  max_speed_kn: 0.5          # "stopped" means slower than this
  min_hours: 6               # stopped for at least this long
  port_radius_nm: 5          # within this distance of a port's berth
  merge_within_hours: 36     # anchorage + berth at the same port within this window = one call

ais_gap:
  min_hours: 6               # no position for longer than this, at sea
  high_hours: 24             # High severity when the gap is longer than this
  near_sensitive_nm: 100     # ... or when it starts within this distance of a sensitive zone

draught_change:
  min_meters: 1.0            # reported draught moves by at least this much with no port call between

sts:
  max_dist_m: 500            # another vessel within this distance
  max_speed_kn: 1.0          # both slower than this
  min_hours: 2               # for at least this long, outside port limits

position_jump:
  max_implied_kn: 30         # implied speed between two consecutive fixes above this

identity:
  medium_if_more_than: 1     # Info for one change, Medium for more

sanctions:
  lookback_months: 12
  lists: [OFAC SDN, EU, UK]

history_months: 12           # how much track to fetch and analyse
