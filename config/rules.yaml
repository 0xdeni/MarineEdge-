# Every threshold the rule engine uses: the defaults. An admin changes any number in the app (Profile ›
# Red-flag rules); those changes are stored on the server's data volume and win over this file until
# "Back to the defaults". docs/METHODOLOGY.md explains each rule.
# Units: hours (h), nautical miles (nm), knots (kn), metres (m).

port_call:
  max_speed_kn: 0.5          # "stopped" means slower than this
  min_hours: 6               # stopped for at least this long
  port_radius_nm: 5          # within this distance of a port's berth
  merge_within_hours: 36     # anchorage + berth at the same port within this window = one call

ais_gap:
  min_hours: 6               # no position for longer than this, at sea
  high_hours: 24             # High severity when the gap is longer than this
  near_sensitive_nm: 100     # ... or when it starts within this distance of a sensitive zone
  coverage_min_fixes: 50     # terrestrial feeds only: a cell with fewer fixes than this in 30 days is 'no coverage'
  coverage_max_hours: 72     # ... and gaps up to this length there are Info, not a flag

draught_change:
  min_meters: 1.0            # reported draught moves by at least this much with no port call between

sts:
  max_dist_m: 500            # another vessel within this distance
  max_speed_kn: 1.0          # both slower than this
  min_hours: 2               # for at least this long, outside port limits
  max_lookups_per_vessel: 12 # cap on paid 'vessels near' queries per vessel per run (each one costs credits)

position_jump:
  max_implied_kn: 30         # implied speed between two consecutive fixes above this

identity:
  medium_if_more_than: 1     # Info for one change, Medium for more

sanctions:
  lookback_months: 12        # reserved: how long a removal from a list will still count, once removals are tracked
  lists: [OFAC SDN, EU, UK]  # a listing in force is a hit however long ago it began

history_months: 12           # how much track to fetch and analyse

# Free live feed (aisstream.io) recording policy — read by the recorder and the prune job
live:
  moving_interval_s: 600     # one stored fix per ship per 10 min while under way...
  stationary_interval_s: 1800  # ...and per 30 min while at anchor or moored
  min_interval_s: 60         # never two stored fixes closer than this
  stationary_kn: 0.5         # a moving ship counts as stopped below this speed...
  moving_kn: 2.0             # ...and a stopped ship as moving above this one (hysteresis: anchor swing is not a departure)
  turn_deg: 25               # store an extra fix when the course changed this much since the last stored fix
  turn_min_kn: 3.0           # (only above this speed; course over ground is noise when nearly stopped)
  keep_types: ["70-89"]      # AIS ship-type codes to record once known: 70–79 cargo, 80–89 tanker; unknown types are kept
  full_res_days: 30          # after this many days thin old rows to one fix per ship per thin_minutes
  thin_minutes: 30
  retention_months: 14       # raw live rows older than this are deleted (analysis window is 12 months)
  min_free_gb: 3             # stop storing positions while the data disk has less free space than this
