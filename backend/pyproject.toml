[project]
name = "marineedge-backend"
version = "0.2.0"
description = "MarineEdge API: AIS provider adapters, rule engine, PostGIS cache, reports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "requests>=2.32",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "psycopg[binary]>=3.2",
  "playwright==1.49.1",
  "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"
