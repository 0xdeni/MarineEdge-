name: ci
on: [push, pull_request]
jobs:
  engine:
    # pure-Python engine, parsers, service and free-path tests; PostgresStore against a real PostGIS
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: vvt, POSTGRES_USER: vvt, POSTGRES_PASSWORD: vvt }
        ports: [ "5432:5432" ]
        options: --health-cmd "pg_isready -U vvt" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pytest ruff "psycopg[binary]>=3.2" requests jinja2
      - run: cd backend && ruff check app tests
      - name: apply migrations
        run: for f in backend/migrations/*.sql; do psql "postgresql://vvt:vvt@localhost:5432/vvt" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: cd backend && pytest -q
        env: { DATABASE_URL: "postgresql://vvt:vvt@localhost:5432/vvt" }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend/public && for f in js/*.js sw.js; do node --check "$f"; done
      - name: every file the shell and the service worker load exists
        run: |
          cd frontend/public
          grep -oE '(src|href)="\./[^"]+"' index.html | sed -E 's/.*"\.\/([^"]+)"/\1/' | while read -r f; do test -f "$f" || { echo "missing $f"; exit 1; }; done
          node -e "const s=require('fs').readFileSync('sw.js','utf8'); const m=s.match(/const SHELL = \[([\s\S]*?)\];/)[1].match(/'([^']+)'/g).map(x=>x.slice(1,-1)).filter(x=>x!=='./'); for (const f of m) if (!require('fs').existsSync(f)) { console.error('missing', f); process.exit(1); }"
  docker:
    # the same images the one-paste installer builds; boots db + api + recorder + web and probes them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i 's/^VVT_REPORT_DIR=.*/VVT_REPORT_DIR=\/data\/reports/; s/^VVT_PROVIDER=.*/VVT_PROVIDER=mock/; s/^VVT_ALLOW_MOCK=.*/VVT_ALLOW_MOCK=1/; s/^API_TOKENS=.*/API_TOKENS=ci:ci-token-123:admin/' .env
      - run: docker compose build
      - run: docker compose up -d db api recorder web
      - name: wait for the API and the migrated database
        run: |
          for i in $(seq 1 40); do curl -fsS http://localhost:8000/api/health && break; sleep 3; done
          curl -fsS http://localhost:8000/api/health
          for i in $(seq 1 40); do docker compose exec -T db psql -U vvt -d vvt -tAc "select 1 from coverage_cells limit 1" >/dev/null 2>&1 && break; sleep 3; done
          docker compose exec -T db psql -U vvt -d vvt -tAc "select count(*) from information_schema.tables where table_schema='public'"
      - name: probe (demo fleet, PostGIS store, token auth)
        run: |
          set -e
          AUTH="Authorization: Bearer ci-token-123"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/me)" = "401"
          curl -fsS -H "$AUTH" "http://localhost:8000/api/vessels/search?q=SILVER" | head -c 400; echo
          IMO=$(curl -fsS -H "$AUTH" "http://localhost:8000/api/regions/blacksea/vessels" | python3 -c "import json,sys; d=json.load(sys.stdin); print([r for r in d if r['imo']][0]['imo'])")
          echo "IMO=$IMO" >> "$GITHUB_ENV"
          curl -fsS -H "$AUTH" "http://localhost:8000/api/vessels/$IMO/analysis" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['stats']['raw'] > 0 and d['verdict']['level']; print('analysis ok', d['vessel']['name'], len(d['track']), 'positions', len(d['flags']), 'flags,', d['verdict']['label'])"
          curl -fsS -H "$AUTH" "http://localhost:8000/api/regions/blacksea/overview" | python3 -c "import json,sys; d=json.load(sys.stdin); print('overview ok', d['counts'])"
          curl -fsS -H "$AUTH" "http://localhost:8000/api/admin/config" | python3 -c "import json,sys; d=json.load(sys.stdin); print('admin config ok · live stats:', d.get('live'))"
          curl -fsS -H "$AUTH" "http://localhost:8000/api/vessels/$IMO/crosscheck" | head -c 300; echo
          curl -fsS -o /dev/null -w 'web %{http_code}\n' http://localhost:8080/
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy: default-src 'self'" && echo "CSP ok"
          curl -fsS -o /dev/null http://localhost:8080/js/app.js && curl -fsS -o /dev/null http://localhost:8080/geo/ne.json && echo "shell files served"
          sleep 5; docker compose logs recorder | grep -q "no aisstream key yet" && echo "recorder idles correctly without a key"
      - name: PDF report
        run: |
          curl -fsS -H "Authorization: Bearer ci-token-123" -o report.pdf "http://localhost:8000/api/vessels/$IMO/report.pdf"
          file report.pdf | grep -q PDF && echo "pdf ok"
      - run: docker compose logs --tail 80 api recorder db
        if: always()
