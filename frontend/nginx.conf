server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

  # Everything the app loads is its own: scripts, styles, map fonts, Natural Earth, the detailed map.
  # Inline styles are allowed (the screens set positions and colours inline); inline scripts are not.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The detailed OpenStreetMap basemap (Profile › Detailed maps): one PMTiles file read with range requests.
  location /tiles/ {
    alias /srv/appdata/maps/;
    default_type application/octet-stream;
    types { }
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
