<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MarineEdge">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Ship due diligence for the Black Sea and the Gulf: twelve months of voyages on one map, every red flag with its evidence.">
<title>MarineEdge</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="./css/app.css">
<script src="./js/theme.js"></script>
</head>
<body>
<div class="boot" id="boot" aria-hidden="true"><svg viewBox="0 0 512 512" width="64" height="64"><defs><linearGradient id="bootBg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#12304F"/><stop offset="0.55" stop-color="#0A1A2E"/><stop offset="1" stop-color="#050C17"/></linearGradient><clipPath id="bootClip"><rect width="512" height="512" rx="115"/></clipPath></defs><rect width="512" height="512" rx="115" fill="url(#bootBg)"/><path d="M112 346 C 138 288, 158 172, 192 172 C 230 172, 228 278, 256 278 C 284 278, 282 172, 320 172 C 354 172, 370 268, 384 318" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="38" stroke-linecap="round"/><circle cx="392" cy="342" r="34" fill="#fff"/><circle cx="392" cy="342" r="19" fill="#0A84FF"/></svg></div>

<div id="map" role="application" aria-label="Map"></div>
<div class="map-veil" id="veil"></div>

<header class="chrome hide" id="homeChrome">
  <button class="gpill tap" id="regionBtn" type="button" aria-haspopup="dialog"><span id="regionName">Black Sea</span><span style="color:var(--text-2)" aria-hidden="true"></span></button>
  <div class="grp">
    <button class="gbtn sm tap" id="alertsBtn" type="button" aria-label="Alerts"><span class="bell"></span><span class="badge-dot" id="alertsBadge" hidden></span></button>
    <button class="gbtn sm tap" id="meBtn" type="button" aria-label="Profile and settings"></button>
  </div>
</header>
<div class="chrome-sub hide" id="liveChip"></div>
<header class="chrome hide" id="shipChrome">
  <button class="gbtn tap" id="shipBack" type="button" aria-label="Back"></button>
  <div class="grp">
    <button class="gbtn tap" id="shipWatch" type="button" aria-label="Watch this ship" aria-pressed="false"></button>
    <button class="gbtn tap" id="shipMore" type="button" aria-label="Share and report" aria-haspopup="dialog"></button>
  </div>
</header>

<div class="dim" id="dim1"></div>
<section class="sheet home" id="homeSheet" aria-label="Search and region">
  <div class="grab"><span></span></div>
  <div class="head" id="homeHead"></div>
  <div class="body" id="homeBody"></div>
</section>
<section class="sheet" id="shipSheet" aria-label="Ship">
  <div class="grab"><span></span></div>
  <div class="head"></div>
  <div class="body" id="shipBody"></div>
</section>
<div class="dim" id="dim2"></div>
<section class="sheet psheet" id="pageSheet" role="dialog" aria-modal="true">
  <div class="grab"><span></span></div>
  <div class="head" id="pageHead"></div>
  <div class="body" id="pageBody"></div>
</section>
<div class="toolbar" id="voyTools" hidden role="toolbar" aria-label="Voyage"></div>
<div class="dim" id="dim3"></div>
<section class="sheet psheet" id="composer" role="dialog" aria-modal="true" aria-label="Note" style="z-index:12">
  <div class="grab"><span></span></div>
  <div class="head" id="composerHead"></div>
  <div class="body" id="composerBody"></div>
</section>
<div class="attr" id="attr"></div>

<div class="pages" id="pages"></div>
<div class="ob" id="ob" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="./vendor/maplibre/maplibre-gl-csp.js"></script>
<script src="./js/pmtiles.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/api.js"></script>
<script src="./js/map.js"></script>
<script src="./js/onboarding.js"></script>
<script src="./js/screens.js"></script>
<script src="./js/profile.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
